name: KasaKeeper
version: "0.3.23"
slug: kasakeeper
description: Home-maintenance dashboard — assets, schedules, trades, and live Home Assistant data.
url: "https://github.com/OnChain-Tech/kasakeeper"
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8099
panel_icon: kk:mark   # the brand eye-house — custom iconset registered by /config/www/kk-icons.js (Lovelace module resource)
panel_title: KasaKeeper
panel_admin: false
homeassistant_api: true
# Supervisor restarts the container if the HTTP server stops answering. (Catches a
# dead/hung listener; a silently-dead background poller thread would not trip it.)
watchdog: "http://[HOST]:[PORT:8099]/api/health"
options:
  anthropic_api_key: ""
  google_places_api_key: ""
  gmail_user: ""
  gmail_app_password: ""
  suburb: ""
schema:
  anthropic_api_key: password?
  google_places_api_key: password?
  gmail_user: str?
  gmail_app_password: password?
  suburb: str?
