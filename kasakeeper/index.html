<body>
  <!-- Brand mark "5B Lid Roof" — house that is also an eye. Three behaviors only:
       watching (default), blink (task done), glance (needs attention). Per Brand Guidelines v1.0. -->
  <svg style="display:none" aria-hidden="true">
    <symbol id="kk-mark" viewBox="0 0 48 48">
      <path d="M8 25 L24 11 L40 25" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>
      <path d="M12.5 28 Q24 38.5 35.5 28" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"></path>
      <circle cx="24" cy="24" r="4.6" fill="var(--accent)"></circle>
    </symbol>
    <symbol id="kk-blink" viewBox="0 0 48 48">
      <path d="M8 25 L24 11 L40 25" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>
      <path d="M12.5 27 Q24 34 35.5 27" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"></path>
    </symbol>
    <symbol id="kk-glance" viewBox="0 0 48 48">
      <path d="M8 25 L24 11 L40 25" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>
      <path d="M12.5 28 Q24 38.5 35.5 28" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"></path>
      <circle cx="29" cy="25" r="4.6" fill="var(--accent)"></circle>
    </symbol>
    <symbol id="kk-sleep" viewBox="0 0 48 48">
      <path d="M8 25 L24 11 L40 25" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>
      <path d="M12.5 26.5 Q24 30.5 35.5 26.5" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"></path>
    </symbol>
    <!-- Structural icon system — the mark's own language: 4px stroke, round caps,
         one "iris" dot only where it earns it. Tints via currentColor. -->
    <symbol id="i-home" viewBox="0 0 48 48"><path d="M8 25 L24 11 L40 25" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path><path d="M12.5 28 Q24 38.5 35.5 28" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"></path><circle cx="24" cy="24" r="4.6" fill="currentColor"></circle></symbol>
    <symbol id="i-schedule" viewBox="0 0 48 48"><rect x="9" y="13" width="30" height="26" rx="6" fill="none" stroke="currentColor" stroke-width="4"></rect><path d="M17 9v7M31 9v7" stroke="currentColor" stroke-width="4" stroke-linecap="round"></path><circle cx="24" cy="28" r="3.6" fill="currentColor"></circle></symbol>
    <symbol id="i-assets" viewBox="0 0 48 48"><rect x="9" y="16" width="30" height="23" rx="5" fill="none" stroke="currentColor" stroke-width="4"></rect><path d="M7 16h34" stroke="currentColor" stroke-width="4" stroke-linecap="round"></path><path d="M19 24h10" stroke="currentColor" stroke-width="4" stroke-linecap="round"></path></symbol>
    <symbol id="i-trades" viewBox="0 0 48 48"><path d="M12 28a12 12 0 0 1 24 0" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"></path><path d="M8 32h32" stroke="currentColor" stroke-width="4" stroke-linecap="round"></path><path d="M24 14v-3" stroke="currentColor" stroke-width="4" stroke-linecap="round"></path></symbol>
    <symbol id="i-ask" viewBox="0 0 48 48"><path d="M10 22a14 12 0 1 1 6 9.5L10 34l2-6" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="24" cy="22" r="3.6" fill="currentColor"></circle></symbol>
    <symbol id="i-settings" viewBox="0 0 48 48"><path d="M10 16h28M10 24h28M10 32h28" stroke="currentColor" stroke-width="4" stroke-linecap="round"></path><circle cx="19" cy="16" r="3.6" fill="currentColor"></circle><circle cx="30" cy="24" r="3.6" fill="currentColor"></circle><circle cx="16" cy="32" r="3.6" fill="currentColor"></circle></symbol>
    <symbol id="i-wrench" viewBox="0 0 48 48"><path d="M29.4 12.6a2 2 0 0 0 0 2.8l3.2 3.2a2 2 0 0 0 2.8 0l7.54-7.54a12 12 0 0 1-15.88 15.88L13.24 40.76a4.24 4.24 0 0 1-6-6l13.82-13.82a12 12 0 0 1 15.88-15.88l-7.52 7.52z" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path></symbol>
    <symbol id="i-gauge" viewBox="0 0 48 48"><path d="M9.5 32A15 15 0 1 1 38.5 32" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"></path><path d="M24 31L32.5 21.5" stroke="currentColor" stroke-width="4" stroke-linecap="round"></path><circle cx="24" cy="32" r="3.4" fill="currentColor"></circle></symbol>
    <symbol id="i-doc" viewBox="0 0 48 48"><path d="M13 10h13l9 9v19H13z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"></path><path d="M26 10v9h9" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"></path><path d="M19 28h10M19 33h6" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"></path></symbol>
    <symbol id="i-bolt" viewBox="0 0 48 48"><path d="M26 9L14 27h8l-2 12 12-18h-8z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"></path></symbol>
    <symbol id="i-bell" viewBox="0 0 48 48"><path d="M14 30v-8a10 10 0 0 1 20 0v8l3 4H11z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"></path><path d="M20 38a4 4 0 0 0 8 0" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"></path></symbol>
    <symbol id="i-drop" viewBox="0 0 48 48"><path d="M24 9c6 8 11 13.5 11 20a11 11 0 1 1-22 0c0-6.5 5-12 11-20z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"></path></symbol>
    <symbol id="i-check" viewBox="0 0 48 48"><path d="M12 25l8 8 16-17" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path></symbol>
  </svg>
  <div id="app">

  </div>
